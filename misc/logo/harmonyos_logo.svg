<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 120" width="512" height="120">
  <defs>
    <linearGradient id="hmGradLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#333333;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="hmGradDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f0f0f0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cccccc;stop-opacity:1" />
    </linearGradient>
  </defs>
  <style>
    .text-main { fill: url(#hmGradLight); }
    .text-sub { fill: #888888; }
    @media (prefers-color-scheme: dark) {
      .text-main { fill: url(#hmGradDark); }
      .text-sub { fill: #aaaaaa; }
    }
  </style>
  <!-- GODOT Engine - main branding -->
  <text x="16" y="82" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="700" class="text-main" letter-spacing="-2">
    GODOT Engine
  </text>
  <!-- Subtitle: HarmonyOS -->
  <text x="20" y="108" font-family="Arial, Helvetica, sans-serif" font-size="14" class="text-sub" letter-spacing="2">
    for <tspan fill="#0070F3" font-weight="700" font-size="15">Harmony</tspan><tspan fill="#0070F3" font-weight="900" font-size="15">O</tspan><tspan fill="#0070F3" font-weight="700" font-size="15">S</tspan>
  </text>
  <!-- Blue underline under O in HarmonyOS -->
  <rect x="207" y="112" width="16" height="2.5" rx="1.25" fill="#0070F3"/>
</svg>
